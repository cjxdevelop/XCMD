[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcmd-tool"
version = "0.1.2"
description = "Named shell commands and dynamic completion from a plain text file"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "xcmd contributors"}]
dependencies = []
keywords = ["cli", "commands", "completion", "bash", "powershell"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Shells",
]

[project.scripts]
xc = "xcmd.cli:main"
xcmd = "xcmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xcmd = ["resources/*.bash", "resources/*.ps1", "resources/*.conf"]

[project.urls]
Homepage = "https://github.com/cjxdevelop/XCMD"
Repository = "https://github.com/cjxdevelop/XCMD"
Issues = "https://github.com/cjxdevelop/XCMD/issues"
