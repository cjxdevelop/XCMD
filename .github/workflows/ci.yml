name: test-and-build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install .
      - run: python scripts/ci_tests.py
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: |
          $env:XCMD_POWERSHELL = (Get-Command powershell.exe).Source
          python scripts/ci_tests.py
          exit $LASTEXITCODE
      - run: python -m build
      - run: python scripts/check_wheel.py dist
