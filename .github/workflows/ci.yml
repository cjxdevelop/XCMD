name: test-and-build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build pipx
      - run: python -m pip install .
      - run: python scripts/ci_tests.py
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows' && !cancelled()
        shell: powershell
        run: |
          $env:XCMD_POWERSHELL = (Get-Command powershell.exe).Source
          python scripts/ci_tests.py
          exit $LASTEXITCODE
      - run: python -m build
      - run: python scripts/check_wheel.py dist
      - run: python scripts/check_bootstrap.py dist

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag and package versions
        run: |
          python - <<'PY'
          import os, sys, tomllib
          from pathlib import Path
          sys.path.insert(0, 'src')
          from xcmd import __version__
          declared = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          expected = 'v' + declared
          if __version__ != declared or os.environ['GITHUB_REF_NAME'] != expected:
              raise SystemExit('Tag, package metadata and runtime versions must match')
          print('Release version verified:', expected)
          PY
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python scripts/check_wheel.py dist
      - name: Generate SHA256 checksums
        run: |
          python - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          folder = Path('dist')
          for name in ('install.sh', 'install.ps1'):
              shutil.copyfile(name, folder / name)
          files = sorted([*folder.glob('*.whl'), *folder.glob('*.tar.gz'), folder / 'install.sh', folder / 'install.ps1'])
          if len(files) != 4:
              raise SystemExit('Expected one wheel, one source distribution and two installers')
          lines = [hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name for p in files]
          (folder / 'SHA256SUMS.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Publish release with verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "XCMD $RELEASE_TAG" --notes-file CHANGELOG.md
          gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/install.sh dist/install.ps1 dist/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --draft=false --latest
